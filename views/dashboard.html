<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Mais Chat — Agenda &amp; Confirmações</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<style>
  :root{
    --white:#FFFFFF; --gray-50:#F5F7FA; --gray-100:#EBEEF3; --gray-200:#D2DAE5;
    --gray-400:#7E98B2; --gray-600:#496280; --gray-800:#354557; --gray-900:#303C4A;
    --orange-500:#FF710A; --orange-50:#FFF7EC; --blue-500:#2F89FF; --blue-50:#EEF7FF;
    --green-500:#01C38D; --green-50:#EAFFF6; --red-700:#DB0000; --red-100:#FFDCDC;
    --yellow-500:#FFA500; --yellow-100:#FFF5C5;
    --radius-sm:10px; --radius-md:15px;
    --shadow-100:0 2px 4px -2px rgba(24,39,75,.12),0 4px 4px -2px rgba(24,39,75,.08);
    --shadow-200:0 4px 6px -4px rgba(24,39,75,.12),0 8px 8px -4px rgba(24,39,75,.08);
  }
  *{box-sizing:border-box}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--gray-50);color:var(--gray-900);margin:0;padding:1.5rem;line-height:1.5}
  header{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.2rem}
  .brand{display:flex;align-items:center;gap:.6rem}
  .brand img{width:32px;height:32px}
  .brand h1{font-size:1.15rem;margin:0;font-weight:700}
  .brand span{color:var(--gray-600);font-weight:500;font-size:.95rem}
  .controls{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
  input[type=date],select{font:inherit;padding:.45rem .6rem;border-radius:var(--radius-sm);
    border:1px solid var(--gray-200);background:var(--white);color:var(--gray-900);max-width:240px}
  button.primary{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:var(--radius-sm);
    background:var(--gray-800);color:var(--white);padding:.5rem .9rem}
  button.primary:disabled{opacity:.6;cursor:default}
  a.logout{color:var(--blue-500);font-size:.85rem;text-decoration:none}
  .toast{display:none;background:var(--red-100);color:var(--red-700);padding:.6rem .9rem;
    border-radius:var(--radius-sm);margin-bottom:1rem;font-size:.9rem}
  .cards{display:flex;gap:.8rem;flex-wrap:wrap;margin-bottom:1.2rem}
  .card{background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius-md);
    padding:.9rem 1.1rem;min-width:110px;box-shadow:var(--shadow-100);cursor:pointer;
    user-select:none;transition:border-color .12s,box-shadow .12s}
  .card:hover{border-color:var(--gray-200)}
  .card.ativa{border-color:var(--orange-500);box-shadow:0 0 0 2px var(--orange-50)}
  .card .n{font-size:1.5rem;font-weight:700} .card .l{font-size:.78rem;color:var(--gray-600)}
  /* duas colunas em uma linha: lista à esquerda, gráfico à direita */
  .split{display:grid;grid-template-columns:1.4fr 1fr;gap:1.2rem;align-items:start}
  @media(max-width:900px){.split{grid-template-columns:1fr}}
  .box{background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius-md);
    padding:1rem;box-shadow:var(--shadow-100);margin-bottom:1.2rem}
  .col-grafico{position:sticky;top:1.5rem}
  .col-grafico h2{font-size:.95rem;margin:0 0 .8rem;font-weight:600;color:var(--gray-800)}
  .chart-wrap{height:320px;position:relative}
  .medico-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem}
  .medico-hd h2{font-size:1rem;margin:0;font-weight:600}
  .medico-hd .badge{background:var(--orange-50);color:var(--orange-500);font-weight:600;
    font-size:.75rem;padding:.15rem .55rem;border-radius:9999px}
  table{width:100%;border-collapse:collapse;font-size:.86rem}
  th,td{text-align:left;padding:.45rem .5rem;border-bottom:1px solid var(--gray-100)}
  th{color:var(--gray-600);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em}
  tr.inelegivel{opacity:.6}
  .chip{display:inline-block;font-size:.74rem;font-weight:600;padding:.12rem .5rem;border-radius:9999px}
  .chip-success{background:var(--green-50);color:var(--green-500)}
  .chip-info{background:var(--blue-50);color:var(--blue-500)}
  .chip-accent{background:var(--orange-50);color:var(--orange-500)}
  .chip-error{background:var(--red-100);color:var(--red-700)}
  .chip-warn{background:var(--yellow-100);color:#8a6d00}
  .chip-gray{background:var(--gray-100);color:var(--gray-600)}
  .vazio{color:var(--gray-600);text-align:center;padding:2rem}
  td.acao,th.acao{width:44px;text-align:center;padding-left:.25rem}
  .enviar{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;
    border:0;border-radius:8px;background:transparent;color:var(--green-500);cursor:pointer;transition:background .12s}
  .enviar:hover{background:var(--green-50)}
  .enviar:disabled{opacity:.5;cursor:default}
  /* com um único médico selecionado, a lista rola por dentro (página não rola);
     a altura máxima é calculada em JS (ajustarScroll) conforme a janela */
  #agendas.uma .tab-wrap{overflow-y:auto}
  #agendas.uma thead th{position:sticky;top:0;background:var(--white);z-index:1}
</style></head><body>
<header>
  <div class="brand">
    <img src="/favicon.svg" alt="Mais Chat">
    <h1>Mais Chat</h1><span>Agenda &amp; Confirmações</span>
  </div>
  <div class="controls">
    <input type="date" id="data">
    <select id="medico" title="Filtrar por médico"><option value="">Todos os médicos</option></select>
    <button class="primary" id="atualizar">Atualizar agenda</button>
    <a class="logout" href="/logout">sair</a>
  </div>
</header>
<div class="toast" id="toast"></div>
<div class="cards" id="cards"></div>
<div class="split">
  <div id="agendas"></div>
  <div class="box col-grafico">
    <h2>Agendamentos por médico</h2>
    <div class="chart-wrap"><canvas id="grafico"></canvas></div>
  </div>
</div>
<script>
const esc=(s)=>String(s??'').replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hora=(iso)=> iso? String(iso).split('T')[1]?.slice(0,5) ?? '' : '';
let chart, ultimo=null, statusFiltro='total';
// [chave, rótulo, predicado da linha] — define os cards e o filtro de status
const CARDS=[
  ['total','Total na agenda',()=>true],
  ['elegiveis','Elegíveis',(r)=>r.elegivel===1],
  ['enviado','Enviados',(r)=>r.ack==='enviado'],
  ['entregue','Entregues',(r)=>r.ack==='entregue'],
  ['lido','Lidos',(r)=>r.ack==='lido'],
  ['falha','Falhas',(r)=>r.ack==='falha'||r.status_envio==='erro'],
  ['pulados','Sem envio',(r)=>r.elegivel===0],
];
const predicado=(k)=>(CARDS.find((c)=>c[0]===k)||CARDS[0])[2];
const rotulo=(k)=>(CARDS.find((c)=>c[0]===k)||[])[1]||'';
// ícone "aviãozinho" de envio (estilo WhatsApp)
const ICON_AVIAO='<svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>';

function statusInfo(r){
  if(r.elegivel===0){
    const m={bloqueio:['Bloqueio','chip-gray'],sem_telefone:['Sem telefone','chip-warn'],sem_paciente:['Sem paciente','chip-warn']};
    return m[r.motivo]||['Não elegível','chip-gray'];
  }
  if(r.ack==='lido')return['Lido','chip-success'];
  if(r.ack==='entregue')return['Entregue','chip-info'];
  if(r.ack==='falha'||r.status_envio==='erro')return['Falha','chip-error'];
  if(r.ack==='enviado')return['Enviado','chip-accent'];
  return['Pendente','chip-gray'];
}

function preencherSelect(medicos){
  const sel=document.getElementById('medico');
  const atual=sel.value;
  const opts=['<option value="">Todos os médicos</option>']
    .concat((medicos||[]).map((m)=>`<option value="${esc(m.nome)}">${esc(m.nome)}</option>`));
  sel.innerHTML=opts.join('');
  // preserva a seleção se o médico ainda existe na lista
  if(atual && (medicos||[]).some((m)=>m.nome===atual)) sel.value=atual;
}

function render(d){
  ultimo=d;
  // popula o seletor com qualquer médico que o snapshot tenha trazido (sem apagar
  // a lista ao vivo já carregada); a fonte principal é /api/medicos.
  if(d.medicos && d.medicos.length) preencherSelect(d.medicos);
  desenhar();
}

async function carregarMedicos(){
  try{
    const r=await fetch('/api/medicos');
    if(r.ok){ const d=await r.json(); preencherSelect(d.medicos); }
  }catch(e){ /* mantém o que houver no seletor */ }
}

function desenhar(){
  const d=ultimo; if(!d) return;
  const medSel=document.getElementById('medico').value;
  // base = filtrada por médico (os cards refletem esse recorte)
  const base = medSel ? d.agenda.filter((r)=>r.nome_medico===medSel) : d.agenda;

  // ---- cards (clicáveis: filtram a lista por status) ----
  document.getElementById('cards').innerHTML=CARDS.map(([k,l,pred])=>
    `<div class="card ${k===statusFiltro?'ativa':''}" data-k="${k}">
       <div class="n">${base.filter(pred).length}</div><div class="l">${esc(l)}</div></div>`).join('');

  // ---- lista (esquerda): filtro de médico + filtro de status (card ativo) ----
  const linhas = base.filter(predicado(statusFiltro));
  const grupos={};
  for(const r of linhas){ (grupos[r.nome_medico]??=[]).push(r); }
  const nomes=Object.keys(grupos);
  const cont=document.getElementById('agendas');
  cont.classList.toggle('uma', !!medSel); // rolagem interna quando 1 médico
  if(!d.agenda.length){
    cont.innerHTML='<div class="box vazio">Sem agenda para esta data.</div>';
  } else if(!base.length){
    cont.innerHTML='<div class="box vazio">Sem agendamentos para este médico nesta data.</div>';
  } else if(!nomes.length){
    cont.innerHTML='<div class="box vazio">Nenhum agendamento em “'+esc(rotulo(statusFiltro))+'” para este filtro.</div>';
  } else {
    cont.innerHTML=nomes.map((med)=>{
      const ls=grupos[med].map((r)=>{
        const [txt,cls]=statusInfo(r);
        const botao = r.elegivel===1
          ? `<button class="enviar" title="Envio manual" aria-label="Envio manual" data-id="${r.id_agendamento}" data-nome="${esc(r.nome_paciente)}">${ICON_AVIAO}</button>`
          : '';
        return `<tr class="${r.elegivel===0?'inelegivel':''}">
          <td class="acao">${botao}</td>
          <td>${esc(hora(r.inicio))}</td><td>${esc(r.nome_paciente)}</td>
          <td>${esc(r.telefone)}</td><td><span class="chip ${cls}">${esc(txt)}</span></td></tr>`;
      }).join('');
      return `<div class="box"><div class="medico-hd"><h2>${esc(med)}</h2>
        <span class="badge">${grupos[med].length} agendamento(s)</span></div>
        <div class="tab-wrap"><table><thead><tr><th class="acao"></th><th>Hora</th><th>Paciente</th><th>Telefone</th><th>Status</th></tr></thead>
        <tbody>${ls}</tbody></table></div></div>`;
    }).join('');
  }

  // ---- gráfico (direita), filtra junto com a lista ----
  const pm = medSel ? d.porMedico.filter((m)=>m.nome_medico===medSel) : d.porMedico;
  const labels=pm.map((m)=>m.nome_medico), valores=pm.map((m)=>m.total);
  if(chart)chart.destroy();
  chart=new Chart(document.getElementById('grafico'),{type:'bar',
    data:{labels,datasets:[{label:'Agendamentos por médico',data:valores,backgroundColor:'#FF710A',borderRadius:6}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{
      x:{ticks:{color:'#496280'},grid:{display:false}},
      y:{beginAtZero:true,ticks:{color:'#496280',precision:0},grid:{color:'#EBEEF3'}}}}});

  ajustarScroll();
}

// limita a altura da lista (1 médico) para a página não precisar de barra de
// rolagem: mede o excesso real da página e encolhe a lista exatamente nisso.
function ajustarScroll(){
  const cont=document.getElementById('agendas');
  const tw=cont.querySelector('.tab-wrap');
  if(!tw) return;
  tw.style.maxHeight=''; // reseta para medir a altura natural
  if(!cont.classList.contains('uma')) return;
  const excesso=document.documentElement.scrollHeight - window.innerHeight;
  if(excesso>0){
    const altura=tw.getBoundingClientRect().height - excesso - 8; // 8px de folga
    tw.style.maxHeight=Math.max(160, altura)+'px';
  }
}

function mostrarErro(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.display='block';
  setTimeout(()=>{t.style.display='none';},4000);
}

async function carregar(){
  const data=document.getElementById('data').value;
  const r=await fetch('/api/dados?data='+data);
  if(!r.ok){ mostrarErro('Falha ao carregar os dados.'); return; }
  render(await r.json());
  atualizarAckDoDia(data); // ao acessar o dia, atualiza os ACKs em segundo plano
}

// consulta o Mais Chat para atualizar enviado->entregue->lido das mensagens do dia
async function atualizarAckDoDia(data){
  try{
    const r=await fetch('/api/atualizar-ack?data='+encodeURIComponent(data),{method:'POST'});
    if(!r.ok) return;
    const d=await r.json();
    // só re-renderiza (preservando filtros) se algum status mudou e ainda é a mesma data
    if(d.ackAtualizados>0 && document.getElementById('data').value===data) render(d);
  }catch(e){ /* silencioso: não atrapalha a visualização */ }
}

async function atualizar(){
  const btn=document.getElementById('atualizar');
  const data=document.getElementById('data').value;
  btn.disabled=true; btn.textContent='Atualizando…';
  try{
    const r=await fetch('/api/atualizar-agenda?data='+data,{method:'POST'});
    if(!r.ok){ mostrarErro('Não foi possível atualizar a agenda no MedX.'); return; }
    render(await r.json());
  } finally { btn.disabled=false; btn.textContent='Atualizar agenda'; }
}

const hoje=new Date().toISOString().slice(0,10);
document.getElementById('data').value=hoje;
document.getElementById('data').addEventListener('change',carregar);
document.getElementById('medico').addEventListener('change',desenhar);
window.addEventListener('resize',ajustarScroll);
document.getElementById('cards').addEventListener('click',(e)=>{
  const card=e.target.closest('.card'); if(!card) return;
  const k=card.dataset.k;
  // clicar no card já ativo (exceto "Total") volta para "Total"
  statusFiltro = (k===statusFiltro && k!=='total') ? 'total' : k;
  desenhar();
});
document.getElementById('atualizar').addEventListener('click',atualizar);
document.getElementById('agendas').addEventListener('click',async (e)=>{
  const b=e.target.closest('.enviar'); if(!b) return;
  const id=b.dataset.id, nome=b.dataset.nome||'';
  if(!confirm('Enviar confirmação para '+nome+'?')) return;
  b.disabled=true;
  try{
    const r=await fetch('/api/enviar?id='+encodeURIComponent(id),{method:'POST'});
    if(r.status!==200){ mostrarErro('Não foi possível enviar a mensagem.'); return; }
    const d=await r.json();
    if(d.dryRun){ mostrarErro('DRY_RUN ativo: envio simulado (nada foi enviado).'); return; }
    carregar(); // recarrega para refletir o novo status
  } finally { b.disabled=false; }
});
carregarMedicos();
carregar();
</script>
</body></html>
